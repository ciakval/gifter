{% load i18n %}{% get_current_language as CURRENT_LANGUAGE %}
<form method="post" action="{% url 'set_language' %}" class="d-inline-flex flex-wrap align-items-center" aria-label="{% translate 'Language' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="en" lang="en" title="English" class="btn btn-link nav-link px-2{% if CURRENT_LANGUAGE == 'en' %} fw-bold{% endif %}"{% if CURRENT_LANGUAGE == 'en' %} aria-current="true"{% endif %}>EN</button>
  <span aria-hidden="true">/</span>
  <button type="submit" name="language" value="cs" lang="cs" title="Čeština" class="btn btn-link nav-link px-2{% if CURRENT_LANGUAGE == 'cs' %} fw-bold{% endif %}"{% if CURRENT_LANGUAGE == 'cs' %} aria-current="true"{% endif %}>CS</button>
</form>
