name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# One deploy at a time per ref; a newer push supersedes a queued one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: gifter
  DEPLOY_DIR: /home/plachtis/DOCKER/gifter  # default deploy user plachtis (bombur-infra); plan 01-05's checkpoint confirms it or rewrites this path

jobs:
  # Gate: nothing is built or deployed unless the app is green.
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Dummy values: the real Google credentials exist only in the server .env.
      PUBLIC_HOSTS: gifter.remesh.cz
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DEBUG: "1"

      # DEBUG=1: the production security block (SSL redirect) would turn every test request into a 301.
      - name: Unit tests
        run: uv run python manage.py test
        env:
          DEBUG: "1"

      # Without --fail-level this gate would pass on warnings and mean nothing.
      - name: Production settings audit
        run: |
          export SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export DEBUG=0
          uv run python manage.py check --deploy --fail-level WARNING

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.git_info.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # for git describe

      - name: Version info
        id: git_info
        run: |
          echo "version=$(git describe --tags --abbrev=7 --always)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.git_info.outputs.sha }}
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.git_info.outputs.version }}
            BUILD_ID=${{ steps.git_info.outputs.sha }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://gifter.remesh.cz
    steps:
      - uses: actions/checkout@v6

      # Third-party actions that receive VPS_SSH_KEY are pinned to full commit SHAs.
      - name: Copy compose.yaml to Bombur
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: compose.yaml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy on Bombur
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd "${{ env.DEPLOY_DIR }}"
            mkdir -p data
            touch .env && chmod 600 .env
            # Persistence evidence: the listing shows the database files left by earlier deploys.
            ls -la data

            # Set KEY=VALUE in .env, replacing an existing line or appending.
            upsert() {
              if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env
              else echo "$1=$2" >> .env; fi
            }
            upsert GITHUB_REPOSITORY "${{ github.repository }}"
            upsert IMAGE_TAG "${{ needs.build-and-push.outputs.image_tag }}"
            upsert CONTAINER_NAME "${{ env.APP }}-web"
            upsert DEPLOY_ENV production

            # Works for private packages too; the token is only valid during this job.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            docker logout ghcr.io

            # Shared host: prune images only (never the host-wide variant); keep recent ones for rollback.
            docker image prune -af --filter "until=72h"
