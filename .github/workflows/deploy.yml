name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Least privilege by default; jobs that need more (packages: write) declare it themselves.
permissions:
  contents: read

# One deploy at a time per ref; a newer push supersedes a queued one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: nothing is built or deployed unless the app is green.
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Dummy values: the real Google credentials exist only in the server .env.
      PUBLIC_HOSTS: gifter.remesh.cz
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0 (no floating major tag exists)
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked

      # gettext is only needed by the catalogue gate; the committed .mo is what ships in the image.
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Czech catalogue is complete and compiled
        run: bash scripts/check-translations.sh

      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DEBUG: "1"

      # DEBUG=1: the production security block (SSL redirect) would turn every test request into a 301.
      - name: Unit tests
        run: uv run python manage.py test
        env:
          DEBUG: "1"

      # Without --fail-level this gate would pass on warnings and mean nothing.
      - name: Production settings audit
        run: |
          export SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export DEBUG=0
          uv run python manage.py check --deploy --fail-level WARNING

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.git_info.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0  # for git describe

      - name: Version info
        id: git_info
        run: |
          echo "version=$(git describe --tags --abbrev=7 --always)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.git_info.outputs.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.git_info.outputs.version }}
            BUILD_ID=${{ steps.git_info.outputs.sha }}

  # Restricted deploy via ciakval/bombur-deploy: the `production` environment secret
  # DEPLOY_SSH_KEY (set by bombur-onboard) only allows "deploy <sha>" for this app.
  # CI never copies files to Bombur or gets a shell there; the server owns compose.yaml and .env.
  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ciakval/bombur-deploy/.github/workflows/deploy.yml@v1
    with:
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      url: https://gifter.remesh.cz
      # No health_path: the app has no health endpoint yet.
    # bombur-deploy's reusable workflow declares no workflow_call secrets (inputs only), yet
    # GitHub requires the caller to pass the production environment secret DEPLOY_SSH_KEY to it.
    # An explicit mapping would be rejected ("not defined in the referenced workflow"), so
    # inherit stays. Follow-up: declare DEPLOY_SSH_KEY in ciakval/bombur-deploy
    # workflow_call.secrets, then map it explicitly here. The @v1 ref stays: bombur-deploy is
    # the same account's own repo and ciakval is its only collaborator.
    secrets: inherit
